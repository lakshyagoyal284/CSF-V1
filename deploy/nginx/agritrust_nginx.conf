# =============================================================================
# AgriTrust AI — Production Hardened Nginx Reverse Proxy Configuration
# Solves OpenVAS Findings:
# 1. Missing HttpOnly Cookie Attribute (via proxy_cookie_path enforcement)
# 2. Missing Security Headers (HSTS, CSP, XFO, nosniff, Referrer, Permissions)
# 3. Information Disclosure (server_tokens off, X-Powered-By removal)
# =============================================================================

# Global Information Leakage Suppression
server_tokens off;

# Upstream definitions
upstream nextjs_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS Primary Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL / TLS Hardening
    # ssl_certificate     /etc/ssl/certs/agritrust.crt;
    # ssl_certificate_key /etc/ssl/private/agritrust.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # Hardened Security Response Headers
    # -------------------------------------------------------------------------
    # HSTS: Enforces HTTPS for 2 years with preloading across all subdomains
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Clickjacking Defense
    add_header X-Frame-Options "DENY" always;

    # MIME-Type Sniffing Protection
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy Baseline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; frame-src 'self' blob:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://*.devtunnels.ms wss://*.devtunnels.ms; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Cross-Origin Policies (COOP & CORP)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Strip upstream runtime signatures
    proxy_hide_header X-Powered-By;

    # -------------------------------------------------------------------------
    # Defense-in-Depth Cookie Enforcement
    # Injects HttpOnly, Secure, and SameSite=Lax on all outgoing cookies
    # -------------------------------------------------------------------------
    proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";

    # Global proxy timeouts & buffer caps
    client_max_body_size 10M;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # API Routes -> FastAPI Backend
    location /api/ {
        proxy_pass http://fastapi_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Frontend UI Routes -> Next.js
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;

        # WebSocket support for Next.js hot reload / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
